<!DOCTYPE html>
<head>
<title>etymological spelling keyboard</title>
<link rel="icon" href="fish.png"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="overlay" class="overlay" style="visibility: hidden;">
    <div>
      <label class="small" for="settings-long-mode">Long Vowel Format</label>
      <select name="settings-long-mode" id="settings-long-mode">
        <option value="acute">acute [ẹ ẹ́]</option>
        <option value="double">double [ẹ ẹẹ]</option>
        <option value="unpack" selected>unpack [ẹ eo]</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-i">High Front</label>
      <select name="settings-i" id="settings-i">
        <option value="ı" selected>ı</option>
        <option value="i">i</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-O">Mid Umlauted</label>
      <select name="settings-O" id="settings-O">
        <option value="ɘ" selected>ɘ</option>
        <option value="œ">œ</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-A">Low Front</label>
      <select name="settings-A" id="settings-A">
        <option value="ɐ" selected>ɐ</option>
        <option value="æ">æ</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-a">(Native) Low Back</label>
      <select name="settings-a" id="settings-a">
        <option value="ɑ" selected>ɑ</option>
        <option value="a">a</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-a\">Low Back-Rounded</label>
      <select name="settings-a\" id="settings-a\">
        <option value="ɒ" selected>ɒ</option>
        <option value="ą">ą</option>
        <option value="ɑ̨">ɑ̨</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-n\">Palatal Nasal</label>
      <select name="settings-n\" id="settings-n\">
        <option value="ɲ" selected>ɲ</option>
        <option value="ń">ń</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-q">(Native) Voiceless Velar Stop</label>
      <select name="settings-q" id="settings-q">
        <option value="q" selected>q</option>
        <option value="c">c</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-g">(Native) Voiced Velar Stop</label>
      <select name="settings-g" id="settings-g">
        <option value="ḡ" selected>ḡ</option>
        <option value="g">g</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-w">Rounded-Velar Approximant</label>
      <select name="settings-w" id="settings-w">
        <option value="ʋ" selected>ʋ</option>
        <option value="w">w</option>
      </select>
    </div>
    <div>
      <label class="small" for="settings-j">Palatal Approximant</label>
      <select name="settings-j" id="settings-j">
        <option value="ȷ" selected>ȷ</option>
        <option value="j">j</option>
      </select>
    </div>
  </div>

  <div id="buttons" class="center">
    <table>
      <tr>
        <td title="high front long" accesskey="iL">ıı</td>
        <td title="high umlauted long" accesskey="yL">yy</td>
        <td title="high umlaut-broken long" accesskey="i\\L">ıy</td>
        <td title="high broken long" accesskey="i\L">ıo</td>
        <td></td>
        <td title="high back long" accesskey="uL">uu</td>
      </tr>
      <tr>
        <td title="high front short" accesskey="i">ı</td>
        <td title="high umlauted short" accesskey="y">y</td>
        <td title="high umlaut-broken short" accesskey="i\\">ı̨</td>
        <td title="high broken short" accesskey="i\">ı̣</td>
        <td></td>
        <td title="high back short" accesskey="u">u</td>
      </tr>
      <tr>
        <td title="mid front long" accesskey="eL">ee</td>
        <td title="mid umlauted long" accesskey="OL">ɘɘ</td>
        <td></td>
        <td title="mid broken long" accesskey="e\L">eo</td>
        <td></td>
        <td title="mid back long" accesskey="oL">oo</td>
      </tr>
      <tr>
        <td title="mid front short" accesskey="e">e</td>
        <td title="mid umlauted short" accesskey="O">ɘ</td>
        <td></td>
        <td title="mid broken short" accesskey="e\">ẹ</td>
        <td></td>
        <td title="mid back short" accesskey="o">o</td>
      </tr>
      <tr>
        <td title="low front long" accesskey="AL">ɐɐ</td>
        <td></td>
        <td></td>
        <td title="low broken long" accesskey="A\L">ɐɒ</td>
        <td title="low back-unrounded long" accesskey="aL">ɑɑ</td>
        <td title="low back-rounded long" accesskey="a\L">ɒɒ</td>
      </tr>
      <tr>
        <td title="low front short" accesskey="A">ɐ</td>
        <td></td>
        <td></td>
        <td title="low broken short" accesskey="A\">ạ</td>
        <td title="low back-unrounded short" accesskey="a">ɑ</td>
        <td title="low back-rounded short" accesskey="a\">ɒ</td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td title="labial nasal" accesskey="m">m</td>
        <td title="coronal nasal" accesskey="n">n</td>
        <td title="palatal(-ized/-izable) nasal" accesskey="n\">ɲ</td>
        <td title="velar(-ized/-izable) nasal" accesskey="N">ŋ</td>

        <td></td>
        <td></td>
      </tr>
      <tr>
        <td title="voiceless labial stop"  accesskey="p">p</td>
        <td title="voiceless coronal stop" accesskey="t">t</td>
        <td title="voiceless palatal stop" accesskey="C">ć</td>
        <td title="voiceless velar stop"   accesskey="q">q</td>

        <td></td>
        <td></td>
      </tr>
      <tr>
        <td title="voiced labial stop"  accesskey="b">b</td>
        <td title="voiced coronal stop" accesskey="d">d</td>
        <td title="voiced palatal stop" accesskey="G">ǵ</td>
        <td title="voiced velar stop"   accesskey="g">ḡ</td>

        <td></td>
        <td></td>
      </tr>
      <tr>
        <td title="voiced labial lenited-stop"  accesskey="6">6</td>
        <td title="voiced coronal lenited-stop" accesskey="d\">δ</td>
        <td title="voiced palatal lenited-stop" accesskey="G\">ȝ</td>
        <td title="voiced velar lenited-stop"   accesskey="g\">ᵹ</td>

        <td></td>
        <td></td>
      </tr>
      <tr>
        <td title="voiceless labial fricative"   accesskey="f">f</td>
        <td title="voiceless coronal fricative"  accesskey="T">þ</td>
        <td title="voiceless sibilant fricative" accesskey="s">s</td>
        <td title="voiceless velar fricative"    accesskey="h">h</td>

        <td></td>
        <td title="morpheme boundary" accesskey="+">·</td>
      </tr>
      <tr>
        <td title="voiced labial fricative"   accesskey="v">v</td>
        <td title="voiced coronal fricative"  accesskey="D">ð</td>
        <td title="voiced sibilant fricative" accesskey="z">z</td>
        <td title="voiced velar fricative"    accesskey="H">ɦ</td>

        <td></td>
        <td title="contraction" accesskey="'">’</td>
      </tr>
      <tr>
        <td title="rounded-velar approximant" accesskey="w">w</td>
        <td title="lateral" accesskey="l">l</td>
        <td title="palatal approximant" accesskey="j">ȷ</td>
        <td title="rhotic" accesskey="r">r</td>

        <td></td>
        <td title="irregular voicing" accesskey="`">‘</td>
      </tr>

    </table>
  </div>

  <div class="texty center">
    <label>ASCII</label> <br/>
    <input id="ascii-input"></input>
  </div>
  <br/><br/>
  <div class="texty center">
    <label>Etym</label> <br/>
    <input readonly id="etym-output"></input>
  </div>
  <br/><br/>
  <div class="texty center">
    <label>Etym-Runes</label> <br/>
    <input readonly id="rune-output"></input>
  </div>
  <br/><br/>
  <div class="center" style="width: 50%;">
    <button id="copy-latin-button">Copy Latin</button>
    <button id="copy-runes-button">Copy Runes</button>
    <button id="clear-button">Clear Fields</button>
    <a id="copy-indicator" style="opacity: 0;">Copied!</a>
  </div>

  <script src="js/encoding.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
